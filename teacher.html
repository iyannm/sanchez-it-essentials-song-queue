<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Song Queue Teacher View</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 900px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .spacer { flex: 1; }
    .count { font-weight: 700; color: var(--accent); }
    #qrOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex;
      align-items: center; justify-content: center; padding: 16px; z-index: 10;
    }
    #qrOverlay .panel { background: #fff; color: #111; border-radius: 16px; padding: 24px; text-align: center; max-width: 560px; width: 100%; }
    #qrOverlay h2 { margin: 0 0 12px; font-size: 1.4rem; }
    #qrCode svg { width: 100%; max-width: 420px; height: auto; }
    #qrLink { font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; margin: 12px 0; }
    #lock { max-width: 420px; margin: 12vh auto 0; }
    #lock .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 12px 0; }
    #lock input[type="password"] {
      width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--bg); color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap" id="lock">
    <form class="card" id="lockForm">
      <h1 style="font-size:1.3rem;margin-top:0">🔒 Teacher View</h1>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <label class="check"><input type="checkbox" id="remember"> Remember on this computer</label>
      <div id="pwError" class="notice bad hidden">Wrong password.</div>
      <button type="submit" id="pwBtn">Unlock</button>
    </form>
  </div>

  <div class="wrap hidden" id="app">
    <header>
      <h1>🎧 Song Queue: Teacher View</h1>
      <p>Requests from <a id="studentLink" href="./">the student page</a> show up here automatically.
        <span id="howTo">Click <b>Open in Spotify</b>, then right-click the song and choose <b>Add to queue</b>.</span></p>
    </header>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="secondary" data-tab="new" aria-pressed="true">New <span id="c-new"></span></button>
        <button class="secondary" data-tab="queued">Queued <span id="c-queued"></span></button>
        <button class="secondary" data-tab="rejected">Rejected <span id="c-rejected"></span></button>
      </div>
      <div class="spacer"></div>
      <button class="secondary" id="clearBtn">Clear this list</button>
      <button class="secondary hidden" id="spotifyBtn">Connect Spotify</button>
      <button id="qrBtn">Show QR code</button>
      <button class="secondary" id="lockBtn">🔒 Lock</button>
    </div>

    <div id="error" class="notice bad hidden"></div>
    <div id="spotifyMsg" class="notice hidden"></div>
    <div id="list" class="card"><p class="muted">Loading requests…</p></div>
    <p class="muted" id="updated"></p>
  </div>

  <div id="qrOverlay" class="hidden">
    <div class="panel">
      <h2>Sanchez IT Essentials Class Song Queue</h2>
      <div id="qrCode"></div>
      <div id="qrLink"></div>
      <button id="qrClose">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="config.js"></script>
  <script>
    const C = window.QUEUE_CONFIG;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const KEY = "songQueue:" + C.topic;
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { songs: {}, seen: [] }; } catch { return { songs: {}, seen: [] }; } };
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

    let state = load();
    let tab = "new";
    const studentUrl = new URL("./", location.href).href;
    $("studentLink").href = studentUrl;

    // Pull every message the relay still has (~12h) and merge in the ones we haven't seen.
    async function refresh() {
      try {
        const res = await fetch(`${C.relay}/${C.topic}/json?poll=1&since=all`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const seen = new Set(state.seen);
        for (const line of text.split("\n")) {
          if (!line.trim()) continue;
          let msg, req;
          try { msg = JSON.parse(line); req = JSON.parse(msg.message); } catch { continue; }
          if (msg.event !== "message" || seen.has(msg.id) || !req.trackId) continue;
          seen.add(msg.id);
          const key = String(req.trackId);
          const s = state.songs[key] || (state.songs[key] = {
            ...req, status: "new", count: 0, names: [], firstAt: msg.time * 1000,
          });
          s.count++;
          s.lastAt = msg.time * 1000;
          if (req.lyricsChecked) s.lyricsChecked = true;
          if (req.name && !s.names.includes(req.name)) s.names.push(req.name);
          // A song that was already played comes back as a new request.
          if (s.status === "queued" && s.lastAt > (s.statusAt || 0)) { s.status = "new"; s.count = 1; }
        }
        state.seen = [...seen].slice(-2000);
        save();
        $("error").classList.add("hidden");
        $("updated").textContent = "Last checked " + new Date().toLocaleTimeString() + ". Updates every 15 seconds.";
      } catch (err) {
        const e = $("error");
        e.classList.remove("hidden");
        e.textContent = "Couldn't reach the request relay (ntfy.sh). Showing saved requests. Retrying…";
      }
      render();
    }

    function spotifyUrl(s) {
      return "https://open.spotify.com/search/" + encodeURIComponent(`${s.title} ${s.artist}`.replace(/\s*[\(\[].*?[\)\]]/g, ""));
    }

    function render() {
      const all = Object.values(state.songs);
      for (const t of ["new", "queued", "rejected"]) {
        const n = all.filter((s) => s.status === t).length;
        $("c-" + t).textContent = n ? `(${n})` : "";
      }
      const list = all.filter((s) => s.status === tab)
        .sort((a, b) => tab === "new" ? (b.count - a.count) || (a.firstAt - b.firstAt) : (b.statusAt || 0) - (a.statusAt || 0));
      const box = $("list");
      if (!list.length) {
        box.innerHTML = `<p class="muted">${tab === "new" ? "No new requests yet. Show the QR code so students can join." : "Nothing here."}</p>`;
        return;
      }
      box.innerHTML = list.map((s) => `
        <div class="song">
          <img src="${esc(s.artwork)}" alt="" loading="lazy">
          <div class="info">
            <div class="title">${esc(s.title)} ${s.count > 1 ? `<span class="count">×${s.count}</span>` : ""}</div>
            <div class="meta">${esc(s.artist)} · ${esc(s.album)}</div>
            <div class="meta">${s.names.length ? "Requested by " + esc(s.names.join(", ")) : "Anonymous"} · ${new Date(s.firstAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</div>
            ${s.explicitness === "cleaned" ? `<span class="tag good">Clean version: pick the clean one in Spotify</span> ` : ""}
            ${s.lyricsChecked ? `<span class="tag good">Lyrics checked</span>` : `<span class="tag warn">Lyrics not checked: review first</span>`}
          </div>
          <div class="actions">
            ${spotifyOn() && tab !== "queued" ? `<button data-act="spotify" data-id="${s.trackId}">▶ Queue</button>` : ""}
            <a class="btn${spotifyOn() ? " secondary" : ""}" href="${spotifyUrl(s)}" target="_blank" rel="noopener">Open in Spotify</a>
            ${tab !== "queued" ? `<button class="secondary" data-act="queued" data-id="${s.trackId}">✓ ${spotifyOn() ? "Mark queued" : "Queued"}</button>` : ""}
            ${tab !== "rejected" ? `<button class="secondary" data-act="rejected" data-id="${s.trackId}">✕ Reject</button>` : ""}
            ${tab !== "new" ? `<button class="secondary" data-act="new" data-id="${s.trackId}">↺ Back to new</button>` : ""}
          </div>
        </div>`).join("");
    }

    $("list").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const s = state.songs[b.dataset.id];
      if (b.dataset.act === "spotify") { queueOnSpotify(s, b); return; }
      s.status = b.dataset.act;
      s.statusAt = Date.now();
      save();
      render();
    });

    // One-click queueing through the Spotify Web API. Uses the PKCE login flow, so only the
    // public Client ID lives in this page; tokens stay in this browser's storage.
    const SP_KEY = "spotifyAuth:" + C.spotifyClientId;
    const SP_SCOPES = "user-modify-playback-state user-read-playback-state";
    const spRedirect = location.origin + location.pathname;
    const spLoad = () => { try { return JSON.parse(localStorage.getItem(SP_KEY)); } catch { return null; } };
    let spAuth = spLoad();
    const spotifyOn = () => !!(C.spotifyClientId && spAuth);

    function spSave(auth) {
      spAuth = auth;
      try { auth ? localStorage.setItem(SP_KEY, JSON.stringify(auth)) : localStorage.removeItem(SP_KEY); } catch {}
      spUpdateUi();
      render();
    }

    function spMsg(text, good) {
      const m = $("spotifyMsg");
      m.className = "notice " + (good ? "good" : "bad");
      m.textContent = text;
      clearTimeout(spMsg.t);
      spMsg.t = setTimeout(() => m.classList.add("hidden"), good ? 5000 : 15000);
    }

    function spUpdateUi() {
      const b = $("spotifyBtn");
      b.classList.toggle("hidden", !C.spotifyClientId);
      b.textContent = spAuth ? "Disconnect Spotify" : "Connect Spotify";
      $("howTo").innerHTML = spAuth
        ? "Click <b>▶ Queue</b> to add a song to the end of your Spotify queue. Spotify must be open and playing on some device."
        : "Click <b>Open in Spotify</b>, then right-click the song and choose <b>Add to queue</b>.";
    }

    const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

    async function spConnect() {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
      const stateTok = b64url(crypto.getRandomValues(new Uint8Array(16)));
      const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      try { sessionStorage.setItem("spotifyPkce", JSON.stringify({ verifier, state: stateTok })); } catch {}
      location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
        response_type: "code", client_id: C.spotifyClientId, scope: SP_SCOPES,
        redirect_uri: spRedirect, code_challenge_method: "S256", code_challenge: challenge, state: stateTok,
      });
    }

    async function spToken(params) {
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ client_id: C.spotifyClientId, ...params }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error_description || data.error || "HTTP " + res.status);
      return {
        access: data.access_token,
        refresh: data.refresh_token || spAuth?.refresh,
        expiresAt: Date.now() + (data.expires_in - 60) * 1000,
      };
    }

    // Finish the login when Spotify sends us back here with ?code=...
    async function spHandleRedirect() {
      const p = new URLSearchParams(location.search);
      if (!p.has("code") && !p.has("error")) return;
      history.replaceState(null, "", spRedirect);
      let pkce = null;
      try { pkce = JSON.parse(sessionStorage.getItem("spotifyPkce")); sessionStorage.removeItem("spotifyPkce"); } catch {}
      if (p.has("error") || !pkce || p.get("state") !== pkce.state) {
        spMsg("Spotify connection was cancelled or didn't match. Try Connect Spotify again.");
        return;
      }
      try {
        spSave(await spToken({ grant_type: "authorization_code", code: p.get("code"), redirect_uri: spRedirect, code_verifier: pkce.verifier }));
        spMsg("Spotify connected. Use ▶ Queue to add songs.", true);
      } catch (err) {
        spMsg("Couldn't connect Spotify: " + err.message);
      }
    }

    async function spFetch(path, opts = {}, retried = false) {
      if (!spAuth) throw new Error("Spotify isn't connected.");
      if (Date.now() > spAuth.expiresAt) {
        try { spSave(await spToken({ grant_type: "refresh_token", refresh_token: spAuth.refresh })); }
        catch { spSave(null); throw new Error("Spotify login expired. Click Connect Spotify again."); }
      }
      const res = await fetch("https://api.spotify.com/v1" + path, {
        ...opts, headers: { Authorization: "Bearer " + spAuth.access, ...opts.headers },
      });
      if (res.status === 401 && !retried) { spAuth.expiresAt = 0; return spFetch(path, opts, true); }
      return res;
    }

    const plain = (t) => String(t || "").toLowerCase().replace(/\s*[\(\[].*?[\)\]]/g, "").replace(/\s+-\s+.*$/, "").replace(/[^a-z0-9]+/g, " ").trim();

    // Find the Spotify track for a request. Never picks a version Spotify marks explicit.
    async function spFindTrack(s) {
      const title = plain(s.title), artist = plain(s.artist);
      let items = [];
      for (const q of [`track:${title} artist:${artist}`, `${title} ${artist}`]) {
        const res = await spFetch("/search?" + new URLSearchParams({ q, type: "track", limit: "10" }));
        if (!res.ok) throw new Error("Spotify search failed (HTTP " + res.status + ").");
        items = (await res.json()).tracks?.items || [];
        if (items.length) break;
      }
      if (!items.length) return { error: "Couldn't find this song on Spotify. Use Open in Spotify." };
      const score = (t) => (plain(t.name) === title ? 2 : 0) + (t.artists.some((a) => artist.includes(plain(a.name))) ? 1 : 0);
      const clean = items.filter((t) => !t.explicit).sort((a, b) => score(b) - score(a));
      if (!clean.length || score(clean[0]) === 0) {
        return { error: "Spotify only has an explicit version of this song, so it wasn't queued." };
      }
      return { track: clean[0] };
    }

    async function queueOnSpotify(s, btn) {
      btn.disabled = true;
      btn.textContent = "Queueing…";
      try {
        const found = await spFindTrack(s);
        if (found.error) { spMsg(found.error); return; }
        const t = found.track;
        const res = await spFetch("/me/player/queue?uri=" + encodeURIComponent(t.uri), { method: "POST" });
        if (res.status === 404) { spMsg("Spotify isn't playing anywhere. Open Spotify on this computer, start any song, then try again."); return; }
        if (res.status === 403) { spMsg("Spotify refused: queueing needs Spotify Premium, and your account must be added to the app's User Management list."); return; }
        if (res.status === 429) { spMsg("Spotify says too many requests. Wait a minute and try again."); return; }
        if (!res.ok) { spMsg("Spotify couldn't queue it (HTTP " + res.status + ")."); return; }
        s.status = "queued";
        s.statusAt = Date.now();
        s.spotifyName = `${t.name} · ${t.artists.map((a) => a.name).join(", ")}`;
        save();
        spMsg("Added to Spotify queue: " + s.spotifyName, true);
      } catch (err) {
        spMsg(err.message || "Couldn't reach Spotify.");
      } finally {
        render();
      }
    }

    $("spotifyBtn").addEventListener("click", () => {
      if (spAuth) { spSave(null); spMsg("Spotify disconnected.", true); }
      else spConnect();
    });
    spUpdateUi();
    spHandleRedirect();

    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tab]");
      if (!b) return;
      tab = b.dataset.tab;
      document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      render();
    });

    $("clearBtn").addEventListener("click", () => {
      const btn = $("clearBtn");
      if (btn.dataset.armed !== "1") {
        btn.dataset.armed = "1";
        btn.textContent = "Click again to clear";
        setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Clear this list"; }, 3000);
        return;
      }
      for (const [k, s] of Object.entries(state.songs)) if (s.status === tab) delete state.songs[k];
      btn.dataset.armed = "";
      btn.textContent = "Clear this list";
      save();
      render();
    });

    function showQr() {
      $("qrLink").textContent = studentUrl;
      try {
        const qr = qrcode(0, "M");
        qr.addData(studentUrl);
        qr.make();
        $("qrCode").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
      } catch {
        $("qrCode").innerHTML = "<p>QR code couldn't load. Use the link below.</p>";
      }
      $("qrOverlay").classList.remove("hidden");
    }
    $("qrBtn").addEventListener("click", showQr);
    $("qrClose").addEventListener("click", () => $("qrOverlay").classList.add("hidden"));
    $("qrOverlay").addEventListener("click", (e) => { if (e.target.id === "qrOverlay") $("qrOverlay").classList.add("hidden"); });

    // Password gate. Only a salted PBKDF2 hash is stored here, never the password itself.
    const PW_SALT = "65b973753638a1411ae6bddbb28dc586";
    const PW_HASH = "c8945c1b8bc57c80dd194b2379f7b48691322f5e93cee90a34e3410e5a956581";
    const UNLOCK_KEY = "teacherUnlocked:" + PW_HASH;

    async function hashPassword(pw) {
      const enc = new TextEncoder();
      const salt = new Uint8Array(PW_SALT.match(/../g).map((h) => parseInt(h, 16)));
      const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 300000, hash: "SHA-256" }, key, 256);
      return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function unlock() {
      $("lock").classList.add("hidden");
      $("app").classList.remove("hidden");
      render();
      refresh();
      setInterval(refresh, 15000);
    }

    const remembered = (() => {
      try { return localStorage.getItem(UNLOCK_KEY) === "1" || sessionStorage.getItem(UNLOCK_KEY) === "1"; } catch { return false; }
    })();
    if (remembered) unlock();

    $("lockBtn").addEventListener("click", () => {
      try { localStorage.removeItem(UNLOCK_KEY); sessionStorage.removeItem(UNLOCK_KEY); } catch {}
      location.reload();
    });

    $("lockForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("pwBtn").disabled = true;
      $("pwError").classList.add("hidden");
      const ok = (await hashPassword($("pw").value)) === PW_HASH;
      $("pwBtn").disabled = false;
      if (!ok) {
        $("pwError").classList.remove("hidden");
        $("pw").select();
        return;
      }
      try {
        (($("remember").checked) ? localStorage : sessionStorage).setItem(UNLOCK_KEY, "1");
      } catch {}
      unlock();
    });
  </script>
</body>
</html>
